version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ACCOUNT_ID="${AWS_ACCOUNT_ID:-$(aws sts get-caller-identity --query Account --output text)}"
      - REGION="${AWS_DEFAULT_REGION:-ap-south-1}"
      - REPOSITORY="${IMAGE_REPO_NAME:-week12-docker-app}"
      - REGISTRY="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"
      - aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}"
      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG="latest"; fi
  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t "$REPOSITORY:$IMAGE_TAG" .
      - docker tag "$REPOSITORY:$IMAGE_TAG" "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
      - docker tag "$REPOSITORY:$IMAGE_TAG" "$REGISTRY/$REPOSITORY:latest"
  post_build:
    commands:
      - echo "Pushing Docker image to Amazon ECR..."
      - docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
      - docker push "$REGISTRY/$REPOSITORY:latest"
      - printf '[{"name":"week12-docker-app","imageUri":"%s"}]' "$REGISTRY/$REPOSITORY:$IMAGE_TAG" > imagedefinitions.json
      - echo "Build and push completed."
artifacts:
  files:
    - imagedefinitions.json
